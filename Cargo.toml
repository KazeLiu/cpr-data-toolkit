[package]
name = "cpr-data-toolkit"
version = "1.4.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/KazeLiu/codex-proxy-rs.git", rev = "1fcfc9771d2f15b6c45a60b55ce332b8b2065871", version = "=0.1.0", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
tokio = { version = "1.52.3", features = ["io-std", "macros", "rt", "sync", "time"] }
http = "1.4.0"
rusqlite = { version = "0.38.0", features = ["bundled", "hooks", "limits"] }
rust_decimal = "1.40.0"
toml = "0.9.8"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4", "v5"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10.4"
