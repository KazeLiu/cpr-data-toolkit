name: Build release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check release versions
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const version = require('./plugin.json').version
          const cargo = fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1]
          const lock = fs.readFileSync('Cargo.lock', 'utf8').match(/name = "cpr-data-toolkit"\nversion = "([^"]+)"/)[1]
          if ([cargo, lock, require('./web/package.json').version].some(v => v !== version)) {
            throw new Error('Release versions do not match')
          }
          JS
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-resources
          path: web/dist/
          if-no-files-found: error

  package:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CPR_REV: 28799cc150c6d5fe8288d3d8a0d83ba99b1407cf
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-resources
          path: web/dist/
      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}
      - name: Install Linux link tools
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-zigbuild --version 0.23.4
          python3 -m pip install --target "$RUNNER_TEMP/zig" ziglang==0.14.1
          echo "CARGO_ZIGBUILD_ZIG_PATH=$RUNNER_TEMP/zig/ziglang/zig" >> "$GITHUB_ENV"
      - name: Install pinned package tool
        run: cargo install --locked --git https://github.com/KazeLiu/codex-proxy-rs.git --rev "$CPR_REV" codex-proxy-plugin-cli
      - name: Build and package
        env:
          PLUGIN_TARGET: ${{ matrix.target }}
          PACKAGE_LABEL: ${{ matrix.label }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo zigbuild --release --locked --target "$PLUGIN_TARGET.2.17"
          else
            cargo build --release --locked --target "$PLUGIN_TARGET"
          fi
          cpr-plugin package --manifest plugin.json \
            --binary "target/$PLUGIN_TARGET/release/cpr-data-toolkit" \
            --target "$PLUGIN_TARGET" --resource-map web=web/dist --output-dir dist
          cp docs/installation.md dist/INSTALL.md
          display_version="$(python3 -c 'import json; v=json.load(open("plugin.json"))["version"]; print(v.rsplit(".",1)[0])')"
          zip -j "dist/cpr-data-toolkit-$display_version-$PACKAGE_LABEL.zip" \
            dist/*.tar.gz dist/*.sha256 dist/INSTALL.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.zip
          if-no-files-found: error
